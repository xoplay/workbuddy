name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: girls-puzzle/package-lock.json

      - name: Build girls-puzzle
        working-directory: girls-puzzle
        run: |
          npm ci
          npm run build

      # 产物放进子目录，与 vite base (/workbuddy/girls-puzzle/) 对齐
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r girls-puzzle/dist site/girls-puzzle
          cp site-index.html site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
