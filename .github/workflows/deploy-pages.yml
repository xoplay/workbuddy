name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，排队而非并发
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: girls-puzzle/package-lock.json

      - name: Build girls-puzzle
        working-directory: girls-puzzle
        run: |
          npm ci
          npm run build

      # 组装站点：各项目放进自己的子目录，与 vite base 对齐
      # （base = /workbuddy/girls-puzzle/，故产物必须落在 site/girls-puzzle/）
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r girls-puzzle/dist site/girls-puzzle
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN"><head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>WorkBuddy</title>
          <style>
            body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
                 background:#0a0a0a;color:#fff;font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}
            main{width:min(92vw,420px);padding:32px 0}
            h1{font-size:22px;margin:0 0 4px}
            p.sub{color:#888;font-size:13px;margin:0 0 24px}
            a{display:block;padding:14px 16px;margin-bottom:10px;border:1px solid #262626;border-radius:10px;
              color:#fff;text-decoration:none;transition:border-color .15s,background .15s}
            a:hover{border-color:#FF5C8A;background:#141414}
            a b{display:block;font-size:15px}
            a span{display:block;color:#888;font-size:12px;margin-top:3px}
          </style></head>
          <body><main>
            <h1>WorkBuddy</h1>
            <p class="sub">项目索引</p>
            <a href="./girls-puzzle/"><b>Girls Puzzle</b><span>拼图游戏 · React + TypeScript</span></a>
          </main></body></html>
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
