<!doctype html>
<html lang="en">
  <head>
    <meta name="referrer" content="no-referrer" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
      /* 禁用浏览器下拉刷新 + 触摸选区 + 长按菜单 */
      html, body {
        overscroll-behavior: none;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
    <title>Girls Puzzle - Infinite Zen</title>
    <script>
      window.addEventListener('error', function(e) {
        if (e.message === 'Script error.') { e.preventDefault(); e.stopPropagation(); return true; }
        if (e.message) {
          document.body.innerHTML += '<div style="color:red;z-index:9999;position:fixed;top:0;left:0;background:white;padding:10px;">ERROR: ' + e.message + '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && e.reason.message && e.reason.message.includes('WebSocket')) { e.preventDefault(); return true; }
        document.body.innerHTML += '<div style="color:red;z-index:9999;position:fixed;top:40px;left:0;background:white;padding:10px;">REJECTION: ' + (e.reason && e.reason.message || e.reason) + '</div>';
      });
    </script>
  </head>
  <body>
    <!-- 加载屏：先于 React 挂载绘制，主站共享库缺失时由 main.tsx 兜底关闭 -->
    <div id="xp-load" style="position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center">
      <div style="display:flex;flex-direction:column;align-items:center;gap:18px;width:min(78vw,300px)">
        <img src="/girls-puzzle.svg" alt="" onerror="this.style.display='none'" style="height:38px">
        <div style="color:#888;font-size:13px;letter-spacing:1px">GIRLS PUZZLE</div>
        <div style="width:100%;height:3px;background:#222;border-radius:2px;overflow:hidden">
          <div id="xp-load-fill" style="height:100%;width:0%;background:linear-gradient(90deg,#FF5C8A,#ffb86b);transition:width .2s"></div>
        </div>
        <div style="color:#666;font-size:12px">加载中…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
